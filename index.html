<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paint Claim</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #cdd5e1; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #26304a; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: crosshair; }
  .hud { position: fixed; pointer-events: none; }
  #land { top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); font-weight: 900; font-size: 32px; line-height: 1; text-shadow: 0 2px 0 #fff; }
  #land small { display: block; margin-top: 4px; font-size: 12px; font-weight: 700; opacity: .6; letter-spacing: .05em; text-transform: uppercase; }
  #top { top: max(12px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 170px; padding: 8px 12px; border-radius: 12px;
         background: #ffffffd0; box-shadow: 0 2px 12px #0000001f; font-size: 13px; }
  #top:empty { display: none; }
  #top div { display: flex; align-items: center; gap: 8px; } #top i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  #top span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; } #top b { font-variant-numeric: tabular-nums; } #top .me { font-weight: 800; }
  #feed { top: calc(max(12px, env(safe-area-inset-top)) + 140px); right: max(14px, env(safe-area-inset-right)); font-size: 12px; font-weight: 700; text-align: right; text-shadow: 0 1px 0 #fff; }
  #feed div { margin-top: 3px; }
  #toast { top: 18%; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 900; text-shadow: 0 2px 0 #fff, 0 0 14px #fff; transition: opacity .4s; }
  #hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 30px); left: 0; right: 0; padding: 0 16px; text-align: center; font-size: 15px; font-weight: 700;
          text-shadow: 0 1px 0 #fff, 0 0 8px #fff; transition: opacity .8s; }
  #hint span { display: inline-block; padding: 7px 16px; border-radius: 14px; background: #ffffffe0; box-shadow: 0 2px 10px #0000001f; }
  #hint small { display: block; font-size: 13px; font-weight: 600; opacity: .75; }
  #net { bottom: max(10px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); font-size: 12px; opacity: .7; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #26304a55; }
  #over[hidden] { display: none; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 84vh; overflow: auto; padding: 22px; border-radius: 18px; background: #fff; box-shadow: 0 10px 40px #0003; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 25px; }
  .card h3 { margin: 16px 0 4px; font-size: 12px; color: #7a839a; text-transform: uppercase; letter-spacing: .06em; text-align: left; }
  .card ol { text-align: left; margin: 0 0 16px; padding-left: 26px; font-size: 14px; min-height: 40px; }
  .card li span { float: right; font-variant-numeric: tabular-nums; }
  button.go { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #3a86ff; color: #fff; font: 800 17px system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 0 #2563c9; }
  button.go:active { transform: translateY(3px); box-shadow: 0 1px 0 #2563c9; }
  @media (max-width: 640px) { #top { width: 130px; font-size: 12px; } #land { font-size: 26px; } #feed { top: calc(max(12px, env(safe-area-inset-top)) + 125px); } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="land"></div>
<div class="hud" id="top"></div>
<div class="hud" id="feed"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="net">Connecting…</div>
<div id="over" hidden>
  <div class="card">
    <h2 id="overTitle">You're out</h2>
    <div id="overScore"></div>
    <h3>Most land, all time</h3>
    <ol id="board"><li>Loading the leaderboard…</li></ol>
    <button class="go" id="again">Play again</button>
  </div>
</div>
<script>
/* ═══ PAINT CLAIM · a Multiplayer Agent starter ════════════════════════════════════════
 * Draw a loop, claim the land. Cut their trails. Drop-in, 2–12 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ every number worth tuning: map size, speed, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   GRID .......... the map as squares: trails as squares, filling a closed loop, spawn spots
 *   RUNNERS ....... moving square by square and the rules at each square (shared by players and bots)
 *   WORLD (HOST) .. the land map, who owns which letter, and the bots. Only the host writes these.
 *   BOT BRAIN ..... how a bot picks its next turn
 *   ME ............ my runner: spawning, claiming, getting cut. Each player writes only its own.
 *   OTHERS ........ everyone else's runners, eased between the snapshots they publish
 *   DRAW .......... camera, floor, land, trails, heads, effects, minimap
 *   HUD & OVER .... land %, room top 5, knock-out feed, game-over card, leaderboard, sound
 *   INPUT ......... keys, mouse, swipe
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Runners move one square at a time and only turn 90°, so a trail is just its corner
 *     points. Each player writes its OWN entity: `s` (one packed JSON field: x, y, heading,
 *     alive, trail corners) about 12 times a second, `hb` (heartbeat) once a second, and
 *     `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields: `land0`, `land1` (the
 *     map, one letter per square, 30 rows per field), `slots` {id: letter} and `bots`.
 *     A new host adopts all of them from state and carries on.
 *   - Everyone else sends the host intents: "spawn" {x, y} (stamp my starting patch) and
 *     "claim" {p: corners} (I got home: fill my loop). The host fills the loop and writes
 *     the map. Until it comes back, the claimer shows its loop as already painted.
 *   - BEING CUT IS THE VICTIM'S OWN FACT: only you check other heads against your own trail;
 *     when one reaches it you are out and send "out" {v: you, by: cutter, why}. (The host does
 *     this for bots.) The host clears an out player's land.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "most-land": each player's biggest share of the map (in tenths of a %).
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  grid: 60,            // the map is grid × grid squares
  cell: 24,            // world px per square
  speed: 7.5,          // squares per second
  view: 24,            // about how many squares fit across the screen (bigger = zoomed out)
  seats: 8,            // bots fill the map up to this many runners
  startRadius: 2.3,    // squares: the round patch of land you start with
  maxTurns: 150,       // most corners one trail may have (it has to fit in one field)
  respawnMs: 2500,     // ms a bot waits before it comes back
  botLeg: [3, 9],      // squares a bot goes out before it turns (picked per trip)
  botNerve: 16,        // squares of trail a bot dares before it heads home
  botSight: 7,         // squares: bots go after trails this close and run from heads this close
  botAggr: [0.2, 0.5], // how keen each bot is to chase a trail (0 = never, 1 = always)
  graceMs: 8000,       // ms after anyone spawns before bots will hunt their trail
  botMistake: 0.03,    // chance per square a bot picks a random turn
  board: "most-land",  // leaderboard name (scores are tenths of a % of the map)
};
const BOT_NAMES = ["Splotch", "Doodle", "Inky", "Smudge", "Crayon", "Swatch", "Pastel", "Drizzle", "Glaze", "Squiggle", "Dabble", "Tempera"];
const COLORS = ["#f2545b", "#3a86ff", "#ffb703", "#06b6a4", "#8f5cf7", "#fb7a2c", "#ff5fa8", "#4cbf4a", "#22b8f0", "#b5446e", "#3b4cca", "#a3c614"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'paint-claim',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { grid: 40, seats: 9, speed: 9, view: 30, startRadius: 3.2, botLeg: [5, 12], botNerve: 30, botAggr: [0.3, 0.6], botMistake: 0.01, respawnMs: 700 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}

async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const join = MP.join({ ...MP_CONNECT });
    const mp = await Promise.race([join, new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}

const parse = (v, fallback) => { if (typeof v !== "string") return fallback; try { return JSON.parse(v); } catch { return fallback; } };
const memo = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback);
  memo.set(key, { raw, v });
  return v;
}
const shared = (key, fallback) => parseOnce("shared:" + key, S.shared[key], fallback);
let net = null;      // the room client (real or local)
let S = { entities: { players: {} }, shared: {} }; // latest state
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock

/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── GRID ────────────────────────────────────────────────────────────────────────────
// The map is one letter per square: "." is nobody's, "a".."Z" are owners (see `slots`).
const N = CONFIG.grid, CELL = CONFIG.cell, EMPTY = ".";
const LETTERS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
const ROWS_PER_FIELD = Math.floor(1800 / N), FIELDS = Math.ceil(N / ROWS_PER_FIELD); // each land field stays under 2048 chars
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // right, down, left, up
const idx = (x, y) => y * N + x;
const inGrid = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = ([a, b]) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (list) => list[Math.floor(Math.random() * list.length)];
let G = "";   // this frame's map: the host's own copy, or the land fields joined
let ML = "";  // this frame's letter of mine ("" until the host gives me one)

/** Every square along a trail of corner points (straight lines between them), or null if it isn't one. */
function squaresOf(pts) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (!Array.isArray(p) || !Number.isInteger(p[0]) || !Number.isInteger(p[1]) || !inGrid(p[0], p[1])) return null;
    if (i === 0) { out.push(idx(p[0], p[1])); continue; }
    const [px, py] = pts[i - 1], sx = Math.sign(p[0] - px), sy = Math.sign(p[1] - py);
    if (sx && sy) return null; // not a straight line
    for (let x = px, y = py; x !== p[0] || y !== p[1]; ) { x += sx; y += sy; out.push(idx(x, y)); }
  }
  return out;
}

/** The squares a closed loop wins: the trail itself plus everything it walls off from the map's edge. */
function enclosed(isMine, trail) {
  const P = N + 2, wall = new Uint8Array(P * P), seen = new Uint8Array(P * P);
  const pad = (i) => ((i / N) | 0) * P + P + (i % N) + 1; // the map with a ring of open squares around it
  for (let i = 0; i < N * N; i++) if (isMine(i)) wall[pad(i)] = 1;
  for (const i of trail) wall[pad(i)] = 1;
  const stack = [0]; seen[0] = 1;
  while (stack.length) { // flood the outside in from the ring; whatever it can't reach is inside the loop
    const j = stack.pop(), x = j % P;
    for (const k of [x > 0 ? j - 1 : -1, x < P - 1 ? j + 1 : -1, j - P, j + P]) {
      if (k >= 0 && k < P * P && !seen[k] && !wall[k]) { seen[k] = 1; stack.push(k); }
    }
  }
  const out = [];
  for (let i = 0; i < N * N; i++) if (!seen[pad(i)] && !isMine(i)) out.push(i);
  return out;
}

/** The round patch a runner starts on. */
function spawnSquares(x, y) {
  const out = [], r = Math.ceil(CONFIG.startRadius);
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= CONFIG.startRadius ** 2 && inGrid(x + dx, y + dy)) out.push(idx(x + dx, y + dy));
  return out;
}

/** A spot with little land around it and nobody near. */
function findSpawn() {
  const heads = runners().filter((r) => r.alive && r !== me);
  let best = { x: N >> 1, y: N >> 1 }, bestScore = -Infinity;
  for (let tries = 0; tries < 40; tries++) {
    const x = rint([4, N - 5]), y = rint([4, N - 5]);
    let score = Math.random();
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (G[idx(x + dx, y + dy)] !== EMPTY) score -= 1;
    for (const h of heads) score -= Math.max(0, 8 - Math.abs(h.x - x) - Math.abs(h.y - y)) * 2;
    if (score > bestScore) { bestScore = score; best = { x, y }; }
  }
  return best;
}
const facingCenter = (at) => (Math.abs(N / 2 - at.x) > Math.abs(N / 2 - at.y) ? (at.x < N / 2 ? 0 : 2) : (at.y < N / 2 ? 1 : 3));

// ── RUNNERS ─────────────────────────────────────────────────────────────────────────
// A runner is me or a bot: { id, name, color, cx, cy (the last square center reached), t (0..1 on
// the way to the next one), dir, want, queue, x, y, trail (corner points), keys (trail squares), alive }.
function newRunner(id, name, color, bot) {
  return { id, name, color, bot, cx: 0, cy: 0, t: 0, x: 0, y: 0, dir: 0, want: 0, queue: [], trail: [], keys: new Set(), moved: [], alive: false, kills: 0 };
}
function placeRunner(r, x, y, dir) { Object.assign(r, { cx: x, cy: y, t: 0, x, y, dir, want: dir }); r.queue.length = 0; r.trail = []; r.keys.clear(); }
/** The square center a runner at (x, y) heading `d` last passed. */
function lastCenter(x, y, d) {
  const [dx, dy] = DIRS[d] || DIRS[0];
  return [dx > 0 ? Math.floor(x) : dx < 0 ? Math.ceil(x) : Math.round(x), dy > 0 ? Math.floor(y) : dy < 0 ? Math.ceil(y) : Math.round(y)];
}

/** Move a runner along the grid. At each square's center it picks its next heading, then the rules run. */
function stepRunner(r, dt, think) {
  r.moved.length = 0;
  r.t += CONFIG.speed * dt;
  while (r.t >= 1 && r.alive) {
    r.t -= 1;
    const was = r.dir;
    r.cx += DIRS[was][0]; r.cy += DIRS[was][1];
    if (!inGrid(r.cx, r.cy)) { knockOut(r, "wall", ""); break; }
    r.moved.push(idx(r.cx, r.cy));
    if (think) think(r);
    turn(r);
    arrive(r, was);
  }
  if (!r.alive) r.t = 0;
  r.x = r.cx + DIRS[r.dir][0] * r.t; r.y = r.cy + DIRS[r.dir][1] * r.t;
}
/** Take the next queued key press, else the wanted heading. Never a U-turn. */
function turn(r) {
  const back = (r.dir + 2) % 4;
  while (r.queue.length) { const d = r.queue.shift(); if (d !== back && d !== r.dir) { r.dir = r.want = d; return; } }
  if (r.want !== back) r.dir = r.want;
}
const isHome = (r, i) => (r === me ? isMine(i) : world.grid[i] === world.slots[r.id]);

/** The rules at each square, the same for me and the bots. */
function arrive(r, was) {
  const i = idx(r.cx, r.cy);
  if (isHome(r, i)) {
    if (r.trail.length) { const pts = [...r.trail, [r.cx, r.cy]]; r.trail = []; r.keys.clear(); claimed(r, pts); }
  } else {
    if (r.keys.has(i)) return knockOut(r, "self", "");
    if (!r.trail.length) r.trail.push([r.cx - DIRS[was][0], r.cy - DIRS[was][1]]); // the last square of my land
    if (r.dir !== was) r.trail.push([r.cx, r.cy]);
    r.keys.add(i);
    if (r.trail.length > CONFIG.maxTurns) return knockOut(r, "long", "");
  }
  if (!inGrid(r.cx + DIRS[r.dir][0], r.cy + DIRS[r.dir][1])) knockOut(r, "wall", "");
}
const knockOut = (r, why, by) => (r === me ? die(why, by) : botDown(r, why, by));
function claimed(r, pts) {
  if (r === me) return myClaim(pts);
  claimFx(applyClaim(r.id, pts), r.color, false);
}

/** Everyone whose head moved onto new squares this frame: { id, moved: [square, ...] }. */
function cutters() {
  const out = [];
  for (const v of views.values()) if (v.alive && v.moved.length) out.push(v);
  if (world.acting) for (const b of world.bots.values()) if (b.alive && b.moved.length) out.push(b);
  if (me.alive && me.moved.length) out.push(me);
  return out;
}
/** Every runner this screen knows about: others (eased), the host's own bots, and me. */
function runners() {
  const out = [...views.values()];
  if (world.acting) out.push(...world.bots.values());
  out.push(me);
  return out;
}
const runnerById = (id) => runners().find((r) => r.id === id);

// ── WORLD (HOST) ────────────────────────────────────────────────────────────────────
const world = { acting: false, grid: [], slots: {}, bots: new Map(), spawnedAt: new Map(), dirty: new Set(), slotsDirty: false, lastLand: 0, lastBots: 0, lastSweep: 0, lastSpawn: 0 };
const slotsNow = () => (world.acting ? world.slots : shared("slots", {}));

/** The land fields joined into one string (missing or broken fields read as empty). */
function stateGrid() {
  let raw = "";
  for (let k = 0; k < FIELDS; k++) {
    const v = S.shared["land" + k], len = Math.min(ROWS_PER_FIELD, N - k * ROWS_PER_FIELD) * N;
    raw += typeof v === "string" && v.length === len ? v : EMPTY.repeat(len);
  }
  return raw;
}

/** Become host: take over the map, the letters and the bots exactly as state has them. */
function adoptWorld() {
  world.acting = true;
  world.grid = stateGrid().split("");
  world.slots = { ...shared("slots", {}) };
  world.bots.clear(); world.spawnedAt.clear();
  const now = performance.now();
  for (const b of shared("bots", [])) {
    const r = newRunner(b.i, b.n, b.c, true), [cx, cy] = lastCenter(+b.x || 0, +b.y || 0, b.d);
    placeRunner(r, cx, cy, DIRS[b.d] ? b.d : 0);
    r.t = Math.min(0.99, Math.abs(b.x - cx) + Math.abs(b.y - cy));
    r.alive = !!b.a; r.kills = b.k || 0; r.respawnAt = now + 1500; r.aggr = rnd(...CONFIG.botAggr);
    r.trail = r.alive && Array.isArray(b.t) ? b.t.map((p) => [p[0], p[1]]) : [];
    r.keys = new Set(r.trail.length ? squaresOf([...r.trail, [cx, cy]]) || [] : []);
    world.bots.set(r.id, r);
  }
  for (let k = 0; k < FIELDS; k++) world.dirty.add(k); // make sure every land field is in state
}
function setCell(i, ch) {
  if (world.grid[i] === ch) return;
  world.grid[i] = ch; world.dirty.add(Math.floor(i / N / ROWS_PER_FIELD));
}
function ensureSlot(id) {
  if (world.slots[id]) return world.slots[id];
  const used = new Set(Object.values(world.slots)), ch = [...LETTERS].find((c) => !used.has(c));
  if (ch) { world.slots[id] = ch; world.slotsDirty = true; }
  return ch;
}

/** A "spawn" intent: clear what this owner had and stamp its starting patch. */
function applySpawn(id, x, y) {
  if (!Number.isInteger(x) || !Number.isInteger(y) || x < 2 || y < 2 || x > N - 3 || y > N - 3) return;
  const ch = ensureSlot(id);
  if (!ch) return;
  for (let i = 0; i < N * N; i++) if (world.grid[i] === ch) setCell(i, EMPTY);
  for (const i of spawnSquares(x, y)) setCell(i, ch);
  world.spawnedAt.set(id, performance.now());
}

/** A "claim" intent: the trail and everything it closes off becomes the claimer's. Returns the squares won. */
function applyClaim(id, pts) {
  const ch = world.slots[id], trail = Array.isArray(pts) && pts.length <= CONFIG.maxTurns + 2 ? squaresOf(pts) : null;
  if (!ch || !trail) return [];
  const won = enclosed((i) => world.grid[i] === ch, trail);
  for (const i of won) setCell(i, ch);
  return won;
}

/** Twice a second: free the letters of anyone who is out or gone and wipe their land; bots with no land are out. */
function sweep(now) {
  const keep = new Set();
  for (const id of livePlayers()) if (id === me.id ? me.alive : views.get(id)?.alive) keep.add(id);
  for (const b of world.bots.values()) if (b.alive) keep.add(b.id);
  const letters = new Set();
  for (const [id, ch] of Object.entries(world.slots)) {
    if (keep.has(id) || now - (world.spawnedAt.get(id) ?? -1e9) < 3000) { letters.add(ch); continue; }
    delete world.slots[id]; world.slotsDirty = true;
  }
  const count = new Map();
  for (let i = 0; i < N * N; i++) {
    const c = world.grid[i];
    if (c === EMPTY) continue;
    if (!letters.has(c)) setCell(i, EMPTY); else count.set(c, (count.get(c) || 0) + 1);
  }
  for (const b of world.bots.values()) if (b.alive && !count.get(world.slots[b.id]) && now - (world.spawnedAt.get(b.id) ?? -1e9) > 3000) botDown(b, "land", "");
}

const freeColor = () => { const used = new Set(runners().map((r) => r.color)); return COLORS.find((c) => !used.has(c)) || pick(COLORS); };
/** Bots fill the map up to CONFIG.seats; one leaves when a person joins. A bot never wears a person's color. */
function fitBots(now) {
  const humans = livePlayers().filter((id) => !(ATTRACT && id === me.id)).length;
  const want = Math.max(0, CONFIG.seats - humans);
  const people = new Set(runners().filter((r) => !r.bot).map((r) => r.color));
  for (const b of world.bots.values()) if (people.has(b.color)) b.color = freeColor();
  if (world.bots.size > want) { const id = [...world.bots.keys()].pop(); world.bots.delete(id); }
  if (world.bots.size < want && now - world.lastSpawn > 600) {
    world.lastSpawn = now;
    const names = new Set(runners().map((r) => r.name)), id = "b" + Math.random().toString(36).slice(2, 6);
    const b = newRunner(id, BOT_NAMES.find((n) => !names.has(n)) || "Bot", freeColor(), true);
    world.bots.set(id, b); spawnBot(b);

}
function spawnBot(b) {

/** A bot is out (the host decides for bots). Its land goes at once. */
function botDown(b, why, by) {

  b.alive = false; b.respawnAt = performance.now() + CONFIG.respawnMs; b.trail = []; b.keys.clear();
  const ch = world.slots[b.id];
  if (ch) for (let i = 0; i < N * N; i++) if (world.grid[i] === ch) setCell(i, EMPTY);
  const msg = { v: b.id, by: by || "", why };
  net.send("out", msg); onOut(msg);

function hostTick(dt, now) {
  if (!world.acting) adoptWorld();
  G = world.grid;
  fitBots(now);
  for (const b of world.bots.values()) {
    if (!b.alive) { b.moved.length = 0; if (now > b.respawnAt) spawnBot(b); continue; }
    stepRunner(b, dt, botThink);
  }
  // A bot's trail is cut when anyone's head reaches it.
  const heads = cutters();
  for (const b of world.bots.values()) {
    if (!b.alive || !b.keys.size) continue;
    const h = heads.find((h) => h.id !== b.id && h.moved.some((k) => b.keys.has(k)));
    if (h) botDown(b, "cut", h.id);
  }
  if (now - world.lastSweep > 500) { world.lastSweep = now; sweep(now); }
  if (now - world.lastBots > 100) { // ~10/s, one message for every bot
    world.lastBots = now;
    const pack = (trail) => [...world.bots.values()].map((b) => ({ i: b.id, n: b.name, c: b.color, x: +b.x.toFixed(2), y: +b.y.toFixed(2), d: b.dir, a: b.alive ? 1 : 0, t: trail(b), k: b.kills }));
    let json = JSON.stringify(pack((b) => b.trail));
    if (json.length > 2000) json = JSON.stringify(pack((b) => b.trail.slice(-4))); // stay under the 2048-char limit (others just draw less trail)
    net.setShared("bots", json);
  }
  if (now - world.lastLand > 200 && (world.dirty.size || world.slotsDirty)) { // the map only when it changed, at most 5/s
    world.lastLand = now;
    if (world.slotsDirty) { net.setShared("slots", JSON.stringify(world.slots)); world.slotsDirty = false; }
    for (const k of world.dirty) net.setShared("land" + k, world.grid.slice(k * ROWS_PER_FIELD * N, (k + 1) * ROWS_PER_FIELD * N).join(""));
    world.dirty.clear();

}

function myTick(dt, now) {

// ── OTHERS ──────────────────────────────────────────────────────────────────────────

function syncViews(dt, now) {
  const seen = new Set(), live = new Set(livePlayers());
  const add = (id, data, name, color, bot) => {
    if (!data || typeof data.x !== "number" || typeof data.y !== "number") return;
    const d = DIRS[data.d] ? data.d : 0, a = data.a ? 1 : 0;
    seen.add(id);

    if (!v) { v = { id, bot, x: data.x, y: data.y, sx: data.x, sy: data.y, d, a, at: now, trail: [], keys: new Set(), moved: [] }; views.set(id, v); }

    if (data.x !== v.sx || data.y !== v.sy || d !== v.d || a !== v.a) {
      const jump = Math.abs(data.x - v.sx) + Math.abs(data.y - v.sy) > 4;
      if (a && v.a && !jump) v.moved = pathSquares(v.sx, v.sy, data.x, data.y, d);
      if (jump || (a && !v.a)) { v.x = data.x; v.y = data.y; } // respawned: no easing across the map

  }
  if (!world.acting) for (const b of shared("bots", [])) add(b.i, b, b.n, b.c, true);
  for (const id of views.keys()) if (!seen.has(id)) views.delete(id);
}

function draw(dt, now) {

function drawLand(now, x0, x1, y0, y1) {
  const steady = (i) => now - animAt[i] >= ANIM;
  for (const top of [false, true]) for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; ) {
      const i = idx(x, y), c = drawn[i];
      if (!c || !steady(i)) { x++; continue; }
      let e = x + 1;
      while (e <= x1 && drawn[idx(e, y)] === c && steady(idx(e, y))) e++;
      ctx.fillStyle = top ? c : shade(c);
      ctx.fillRect(x * CELL, y * CELL + (top ? 0 : LIP), (e - x) * CELL + 0.5, CELL + 0.5);
      x = e;
    }
  }
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = idx(x, y), a = now - animAt[i];
    if (a >= ANIM) continue;
    const p = Math.max(0, Math.min(1, (a - ((i * 37) % 11) * 11) / (ANIM - 120))), X = x * CELL, Y = y * CELL;
    if (animFrom[i] && drawn[i]) { ctx.fillStyle = animFrom[i]; ctx.fillRect(X, Y, CELL, CELL); }
    const c = drawn[i] || animFrom[i], s = CELL * (drawn[i] ? easeOutBack(p) : 1 - p);
    if (c && s > 0) { ctx.fillStyle = c; ctx.fillRect(X + (CELL - s) / 2, Y + (CELL - s) / 2, s, s); }
  }
}

function drawTrail(r, now) {
  if (!r.trail.length) return;
  const at = (p) => (p + 0.5) * CELL;
  ctx.beginPath(); ctx.moveTo(at(r.trail[0][0]), at(r.trail[0][1]));
  for (let i = 1; i < r.trail.length; i++) ctx.lineTo(at(r.trail[i][0]), at(r.trail[i][1]));
  ctx.lineTo(at(r.x), at(r.y));
  ctx.lineJoin = "miter"; ctx.lineCap = "butt"; ctx.lineWidth = CELL * 0.62; ctx.strokeStyle = r.color;
  ctx.globalAlpha = r === me && me.danger ? 0.4 + 0.3 * Math.sin(now / 60) : 0.6;
  ctx.stroke(); ctx.globalAlpha = 1;
}

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
/** A chunky block with eyes looking where it's going, and its name. */
function drawHead(r) {
  const X = (r.x + 0.5) * CELL, Y = (r.y + 0.5) * CELL, s = CELL * 1.08, [dx, dy] = DIRS[r.dir] || DIRS[0];
  ctx.fillStyle = shade(r.color, 0.55); rrect(X - s / 2, Y - s / 2 + LIP, s, s, 6); ctx.fill();
  ctx.fillStyle = r.color; rrect(X - s / 2, Y - s / 2, s, s, 6); ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = r === me ? "#fff" : "#ffffffaa"; ctx.stroke();
  for (const side of [-1, 1]) {
    const ex = X + dx * 4 - dy * side * 5, ey = Y + dy * 4 + dx * side * 5 - 2;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1d2333"; ctx.beginPath(); ctx.arc(ex + dx * 1.6, ey + dy * 1.6, 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.font = "800 13px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.lineJoin = "round"; ctx.lineWidth = 4; ctx.strokeStyle = "#fff";
  const label = r === me ? (ATTRACT ? myName : "You") : r.name;
  ctx.strokeText(label, X, Y - s / 2 - 7); ctx.fillStyle = shade(r.color, 0.7); ctx.fillText(label, X, Y - s / 2 - 7);
}

const mini = document.createElement("canvas"); mini.width = mini.height = N;
const mctx = mini.getContext("2d"), mimg = mctx.createImageData(N, N);
let miniAt = 0;
function drawMinimap(now) {
  if (ATTRACT) return;
  if (now - miniAt > 250) {
    miniAt = now;
    for (let i = 0; i < N * N; i++) {
      const n = drawn[i] ? parseInt(drawn[i].slice(1), 16) : 0xf4f6fa;
      mimg.data[i * 4] = (n >> 16) & 255; mimg.data[i * 4 + 1] = (n >> 8) & 255; mimg.data[i * 4 + 2] = n & 255; mimg.data[i * 4 + 3] = drawn[i] ? 255 : 170;
    }
    mctx.putImageData(mimg, 0, 0);
  }
  const size = Math.min(120, W * 0.28), x0 = W - size - 14, y0 = H - size - 14 - SAFE_BOTTOM, k = size / N;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#26304a"; ctx.fillRect(x0 - 3, y0 - 3, size + 6, size + 6);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(mini, x0, y0, size, size); ctx.imageSmoothingEnabled = true;
  for (const r of runners()) if (r.alive) {
    ctx.fillStyle = r === me ? "#fff" : r.color; ctx.strokeStyle = "#26304a"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x0 + (r.x + 0.5) * k, y0 + (r.y + 0.5) * k, r === me ? 4 : 2.5, 0, Math.PI * 2); ctx.fill(); if (r === me) ctx.stroke();
  }
}

// ── HUD & OVER ──────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const landOf = new Map(); // id -> squares, counted from the map
const feed = [];
let board = null, netDown = false, toastUntil = 0;
const nameOf = (id) => (id === me.id ? "You" : runnerById(id)?.name || "Someone");
function toast(text) { if (ATTRACT) return; $("toast").textContent = text; $("toast").style.opacity = 1; toastUntil = performance.now() + 1600; }

/** Count everyone's land (about 7 times a second). */
function tally() {
  const count = new Map();
  for (let i = 0; i < N * N; i++) { const c = G[i]; if (c !== EMPTY) count.set(c, (count.get(c) || 0) + 1); }
  landOf.clear();
  for (const [id, ch] of Object.entries(slotsNow())) landOf.set(id, count.get(ch) || 0);
  me.gridCells = ML ? count.get(ML) || 0 : 0;
  let extra = 0;
  for (const i of me.pending.keys()) if (!ML || G[i] !== ML) extra++;
  me.cells = me.gridCells + extra;
}

/** Someone is out: a feed line for everyone, a cheer for the cutter, a burst where it happened. */
function onOut(msg) {
  if (!msg || !msg.v) return;
  const its = msg.v === me.id ? "your" : "their";
  const v = runnerById(msg.v), why = { cut: "cut", self: `crossed ${its} own trail`, wall: "hit the edge", land: `lost all ${its} land`, long: "ran out of trail" }[msg.why] || "is out";
  if (v) burst((v.x + 0.5) * CELL, (v.y + 0.5) * CELL, v.color, 34, 420);
  feed.unshift({ text: msg.why === "cut" ? `${nameOf(msg.by)} cut ${nameOf(msg.v)}` : `${nameOf(msg.v)} ${why}`, color: (runnerById(msg.by) || v || {}).color || "#26304a", at: performance.now() });
  feed.length = Math.min(feed.length, 4);
  if (msg.by && msg.by === me.id && msg.v !== me.id) { me.kills++; toast(`You cut ${nameOf(msg.v)}!`); sfx("kill"); }
  if (msg.v === me.id) sfx("out");
  if (world.acting) { const b = world.bots.get(msg.by); if (b) b.kills++; }
}

function hud(now) {
  if (ATTRACT) { for (const id of ["land", "top", "feed", "toast", "hint", "net"]) $(id).textContent = ""; return; }
  $("land").innerHTML = me.alive ? `${pct(me.cells).toFixed(1)}%<small>of the map${me.kills ? ` · ${me.kills} cut${me.kills === 1 ? "" : "s"}` : ""}</small>` : "";
  const rows = runners().filter((r) => r.alive).map((r) => ({ name: r === me ? "You" : r.name, color: r.color, cells: r === me ? me.cells : landOf.get(r.id) || 0, mine: r === me }));
  rows.sort((a, b) => b.cells - a.cells);
  $("top").innerHTML = rows.slice(0, 5).map((r) => `<div class="${r.mine ? "me" : ""}"><i style="background:${r.color}"></i><span>${esc(r.name)}</span><b>${pct(r.cells).toFixed(1)}%</b></div>`).join("");
  $("feed").innerHTML = feed.filter((f) => now - f.at < 6000).map((f) => `<div style="color:${shade(f.color, 0.75)}">${esc(f.text)}</div>`).join("");
  if (now > toastUntil) $("toast").style.opacity = 0;
  $("hint").style.opacity = me.alive && (!me.ready || now - me.readyAt < 9000) ? 1 : 0;
  $("hint").innerHTML = me.alive && !me.ready ? `<span>${touchUI ? "Swipe" : "Press an arrow key or move the mouse"} to start</span>` :
    `<span>Leave your land, loop back home: everything inside is yours<small>${touchUI ? "Swipe to turn" : "Arrow keys, WASD or the mouse to turn"} · cross a trail to cut it</small></span>`;
  const n = livePlayers().length;
  $("net").textContent = netDown ? "Reconnecting…" : net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the map" : ""}`;
}

function showOver() {
  const title = { cut: `Cut by ${nameOf(me.by)}`, self: "You crossed your own trail", wall: "You hit the edge", land: "Your land was taken", long: "Your trail got too long" }[me.why] || "You're out";
  $("overTitle").textContent = title;
  $("overScore").textContent = `Most land this time: ${me.best.toFixed(1)}%${me.kills ? ` · ${me.kills} cut${me.kills === 1 ? "" : "s"}` : ""}`;
  $("over").hidden = false;
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading the leaderboard…</li>";
  board.submit(Math.round(me.best * 10)).catch(() => null).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${(e.score / 10).toFixed(1)}%</span></li>`).join("") : "<li>No scores yet. You're first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => spawnMe();

// Sound: short blips, started by the first tap or key (browsers block sound before that).
let audio = null;
function unlockAudio() { if (!audio && !ATTRACT) { try { audio = new AudioContext(); } catch { audio = null; } } }
function sfx(kind, size = 0) {
  if (!audio) return;
  const notes = { claim: [520 + Math.min(500, size * 4), 1.5, 0.18, "triangle", 0.12], kill: [660, 2, 0.3, "square", 0.06], out: [220, 0.4, 0.4, "sawtooth", 0.08] }[kind];
  const [f, up, dur, type, vol] = notes, t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * up, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const KEYS = { arrowright: 0, d: 0, arrowdown: 1, s: 1, arrowleft: 2, a: 2, arrowup: 3, w: 3 };
const mouse = { x: 0, y: 0, on: false };
/** Queue a turn (up to two, so a quick double tap at a corner isn't lost). */
function queueTurn(d) {
  const last = me.queue.length ? me.queue[me.queue.length - 1] : me.dir;
  if (d === last || me.queue.length >= 2) return;
  me.queue.push(d);
}
addEventListener("keydown", (e) => {
  unlockAudio();
  const d = KEYS[e.key.toLowerCase()];
  if (d === undefined) return;
  e.preventDefault(); mouse.on = false;
  if (!e.repeat) queueTurn(d);
  go();
});
/** The first input of a life starts my runner. */
function go() { if (me.alive && !me.ready) { me.ready = true; me.readyAt = performance.now(); } }
/** Mouse steering: turn toward the spot under the pointer (through the camera that drew the frame). */
function readMouse() {
  if (!mouse.on || !me.alive) return;
  const wx = (cam.x + (mouse.x - W / 2) / cam.z) / CELL - 0.5, wy = (cam.y + (mouse.y - H / 2) / cam.z) / CELL - 0.5;
  const dx = wx - me.x, dy = wy - me.y, ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 0.6) return;
  let d = ax > ay ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3);
  if (d === (me.dir + 2) % 4) d = ax > ay ? (dy > 0 ? 1 : 3) : (dx > 0 ? 0 : 2); // can't reverse: turn toward its side
  me.want = d;
}
let swipe = null;
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (e.pointerType === "mouse") { mouse.on = true; mouse.x = e.clientX; mouse.y = e.clientY; return; }
  swipe = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { if (Math.hypot(e.clientX - mouse.x, e.clientY - mouse.y) > 4) { mouse.on = true; if ($("over").hidden) go(); } mouse.x = e.clientX; mouse.y = e.clientY; return; }
  if (!swipe || swipe.id !== e.pointerId) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.hypot(dx, dy) < 24) return;
  queueTurn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3));
  swipe.x = e.clientX; swipe.y = e.clientY; go();
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => { if (swipe && swipe.id === e.pointerId) swipe = null; });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastTally = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; world.acting = false; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the map meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (!isHost()) world.acting = false;
  G = world.acting ? world.grid : stateGrid();
  ML = slotsNow()[me.id] || "";
  syncViews(dt, now);
  if (isHost()) { hostTick(dt, now); ML = slotsNow()[me.id] || ""; }
  if (!ATTRACT) readMouse();
  myTick(dt, now);
  if (now - lastTally > 150) { lastTally = now; tally(); hud(now); }
  syncLand(now);
  draw(dt, now);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("spawn", (msg, from) => { if (isHost() && msg) { if (!world.acting) adoptWorld(); applySpawn(from, msg.x, msg.y); } });
  net.on("claim", (msg, from) => { if (isHost() && msg && views.get(from)?.alive) { if (!world.acting) adoptWorld(); claimFx(applyClaim(from, msg.p), views.get(from).color, false); } });
  net.on("out", (msg) => onOut(msg));
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors()]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
